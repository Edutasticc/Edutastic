<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edutastic Inlog</title>
    <link rel="stylesheet" href="login.css"> 
</head>
<body>
    <div class="login-container">
            <div class="form-header">
                <img class="brand-logo" src="Afbeeldingen/Edutastic%20LogoV2.webp" alt="Edutastic">
                <h1>Welkom terug!</h1>
                <p>Voer uw inloggegevens in</p>
            </div>
        <form class="form-box" id="login-form">
            <div class="input-group">
                <input type="email" id="email" class="input-field" placeholder=" " autocomplete="username" required>
                <label for="email" class="floating-label">E-mailadres</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="input-field" placeholder=" " autocomplete="current-password" required>
                <label for="password" class="floating-label">Wachtwoord</label>
                <button type="button" class="eye-icon" id="toggle-password" aria-label="Wachtwoord tonen" aria-pressed="false">
                    <svg id="eye-visible" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye preview-icon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg id="eye-hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off preview-icon" hidden><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
                </button>
            </div>
            <div class="input-group checkbox-group">
                <div class="form-col">
                    <input type="checkbox" id="remember-me-checkbox" class="checkbox-field">
                    <label for="remember-me-checkbox">Onthoud mij</label>
                </div>
                <div class="form-col">
                    <a href="#" class="forgot-password-link">Wachtwoord vergeten?</a>
                </div>
            </div>
            <p class="login-message" id="login-message" role="status" aria-live="polite" hidden></p>
            <button type="submit" class="submit-button">Log in</button>
        </form>
            <p>Heb je nog geen account? <a href="#" class="signup-link">Meld je hier aan</a></p>
        </div>
    </div>
    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordButton = document.getElementById('toggle-password');
        const eyeVisible = document.getElementById('eye-visible');
        const eyeHidden = document.getElementById('eye-hidden');
        const loginForm = document.getElementById('login-form');
        const loginMessage = document.getElementById('login-message');
        const submitButton = loginForm.querySelector('.submit-button');
        const loginEndpoint = window.location.protocol === 'file:' || window.location.port === '5500'
            ? 'http://localhost:5138/login'
            : '/login';

        togglePasswordButton.addEventListener('click', () => {
            const isPasswordVisible = passwordInput.type === 'password';
            passwordInput.type = isPasswordVisible ? 'text' : 'password';
            eyeVisible.toggleAttribute('hidden', isPasswordVisible);
            eyeHidden.toggleAttribute('hidden', !isPasswordVisible);
            togglePasswordButton.setAttribute('aria-pressed', String(isPasswordVisible));
            togglePasswordButton.setAttribute(
                'aria-label',
                isPasswordVisible ? 'Wachtwoord verbergen' : 'Wachtwoord tonen'
            );
        });

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            loginMessage.hidden = false;
            loginMessage.dataset.state = '';
            loginMessage.textContent = 'Bezig met inloggen...';
            submitButton.disabled = true;

            try {
                const response = await fetch(loginEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: passwordInput.value
                    })
                });

                if (response.ok) {
                    window.location.href = loginEndpoint.startsWith('/')
                        ? '/index'
                        : new URL('/index', loginEndpoint).href;
                } else if (response.status === 401) {
                    loginMessage.dataset.state = 'error';
                    loginMessage.textContent = 'E-mailadres of wachtwoord is onjuist.';
                } else {
                    loginMessage.dataset.state = 'error';
                    loginMessage.textContent = 'Inloggen is niet gelukt. Probeer het later opnieuw.';
                }
            } catch {
                loginMessage.dataset.state = 'error';
                loginMessage.textContent = 'Kan de server niet bereiken. Controleer of de backend draait.';
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
